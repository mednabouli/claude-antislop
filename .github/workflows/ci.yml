name: Claude Anti-Slop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Initialize memory
        run: node cli/index.mjs init-memory

      - name: Check status
        run: node cli/index.mjs status --json

      - name: Scan repository
        run: node cli/index.mjs scan --repo . --output ./templates --json > scan.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-antislop-scan
          path: scan.json
          retention-days: 7

      - name: Search memory for patterns
        run: node cli/index.mjs memory-search --query "standards" --limit 5 --json > memory.json

      - name: Upload quality results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-antislop-quality
          path: |
            quality.json
            memory.json
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const scan = JSON.parse(fs.readFileSync('scan.json', 'utf8'));
            const memory = JSON.parse(fs.readFileSync('memory.json', 'utf8'));
            
            let body = '## Claude Anti-Slop Quality Check\n\n';
            body += `**Status:** ${scan.success ? '✅ Pass' : '❌ Fail'}\n`;
            body += `**Message:** ${scan.message}\n\n`;
            
            if (scan.data?.templates?.length) {
              body += `**Templates Generated:** ${scan.data.templates.length}\n\n`;
            }
            
            body += `**Memory Results:** ${memory.data?.count || 0} patterns found\n`;
            
            if (memory.data?.results?.length) {
              body += '\n**Top Patterns:**\n';
              memory.data.results.slice(0, 3).forEach((r, i) => {
                body += `${i + 1}. ${r.file} (score: ${r.score})\n`;
              });
            }
            
            body += '\n---\n*Generated by Claude Anti-Slop*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
