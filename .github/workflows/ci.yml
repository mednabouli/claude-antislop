name: Claude Anti-Slop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify repository structure
        run: |
          echo "Checking repository structure..."
          test -d cli && echo "✓ cli/ directory exists"
          test -d templates && echo "✓ templates/ directory exists"
          test -d docs && echo "✓ docs/ directory exists"
          test -f README.md && echo "✓ README.md exists"
          test -f index.html && echo "✓ index.html exists"
          echo "Repository structure validated!"

      - name: Comment PR with status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '## Claude Anti-Slop CI\n\n✅ Repository structure validated successfully!\n\n---\n*Generated by Claude Anti-Slop CI*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
